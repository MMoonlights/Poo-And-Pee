# Messages
# Note: HEX colors (#RRGGBB) and color codes (&c, &a, etc.) are supported.
# HEX colors require Minecraft 1.16+; on older servers replace them with & codes.
# Colored wool materials are automatically mapped to legacy WOOL data values
# on pre-1.13 servers, so the defaults below work everywhere.
messages:
  only-players: "#DB3B3BOnly players can use this command!"
  pee-command: "#FFFF00You peed!"
  poo-command: "#483C2EYou pooped!"
  cooldown: "#DB3B3BYou need to wait %time% seconds before using this command again!"
  no-permission: "#DB3B3BYou don't have permission to use this command!"
  reload-success: "#22FF00Poo and Pee plugin reloaded successfully!"

# Cooldowns in seconds
cooldowns:
  pee: 4
  poo: 4

# Item settings
items:
  pee:
    material: YELLOW_WOOL
    duration: 5
    velocity: 0.5
    # Lifetime of a single dropped item in ticks (20 = 1 second)
    lifetime: 20
  poo:
    material: BROWN_WOOL
    duration: 5
    velocity: 0.2
    lifetime: 20

# Item protection
settings:
  # Prevent players from picking up dropped items
  block-pickup: true
  # Prevent dropped items from merging with other items on the ground
  block-merge: true