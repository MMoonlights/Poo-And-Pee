name: PooAndPee
version: '${project.version}'
main: de.mmoonlight.pooandpee.PooAndPee
# NOTE: 'api-version' is intentionally omitted so the plugin also loads on legacy (pre-1.13) servers.
description: 'A simple plugin that adds /pee and /poo commands'
authors: [mmoonlight]

commands:
  pee:
    description: Pee command
    usage: /pee
  poo:
    description: Poo command
    usage: /poo
  pooandpee:
    description: Reload command
    usage: /pooandpee reload
    aliases: [pnp]